# Herdr config. Linked to ~/.config/herdr/config.toml by install.sh.
# Apply: herdr server reload-config
# Sidebar/colour ideas from learn.datalumina.com/docs/herdr, reviewed 2026-10-01.
onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[theme.custom]
red = "#4e82ef"     # blocked, needs input
teal = "#4e82ef"    # done, not seen yet
yellow = "#a78bfa"  # working
active_row_bg = "#2c2c2c"

[ui]
status_indicators = "symbols"
agent_panel_sort = "spaces"     # follow workspace order (no per-machine grouping in herdr)
prompt_new_tab_name = false
window_title = "Ghostty: {pane}"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["machine", "agent"],
  ["state_icon", "workspace"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
]

# Prefix stays ctrl+b. cmd keys mirror iTerm/Ghostty tab habits; Ghostty
# unbinds them in config/ghostty/config so they reach herdr.
[keys]
new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
goto = ["prefix+g", "cmd+k"]
previous_tab = ["prefix+p", "cmd+shift+["]
next_tab = ["prefix+n", "cmd+shift+]"]
previous_workspace = "cmd+shift+up"
next_workspace = "cmd+shift+down"

# lazygit popup over the active pane, in that pane's repo. q closes it.
# From learn.datalumina.com/docs/herdr/lazygit. cmd+shift+g only works when the
# terminal passes cmd keys through. The herdr server runs with a minimal PATH
# (no Homebrew), so add the brew bins or lazygit exits 127 and the popup flashes.
[[keys.command]]
key = ["prefix+shift+g", "cmd+shift+g"]
type = "popup"
command = "export PATH=\"$PATH:/home/linuxbrew/.linuxbrew/bin:/opt/homebrew/bin\"; cd \"$HERDR_ACTIVE_PANE_CWD\" && exec lazygit"
description = "lazygit"
width = "90%"
height = "90%"
